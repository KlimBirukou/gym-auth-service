spring:
  application:
    name: gym-auth-server
  output:
    ansi:
      enabled: always

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://gym-auth-database:5432/gym_auth_database?currentSchema=gym_auth_schema
    username: gym_auth_user
    password: LiGzbc7J0ZJza6pp
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        default_schema: gym_auth_schema

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.yaml
    default-schema: gym_auth_schema
    contexts: default,seed

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.epam.gym.gymauthserver: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%clr([){faint}%clr(${spring.application.name:}){cyan}%clr(]){faint} %clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr([%thread]){faint} %clr(%logger{36}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

application:
  request-uid:
    header-name: "X-Request-Uid"
    mdc-key: "requestUid"
  auth:
    secret: ${JWT_SECRET}
    max-login-attempts: 3
    block-duration: PT15M
    jwt-expiration: 86400
  internal:
    secret: AUTH_SECRET_SUPER_PUPER_SECRET_ULTRA_MAX_FOREVER_SECRET
  cors:
    allowed-origins: "*"
  swagger:
    server-url: "http://localhost:8080"
    server-description: "Local server"

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

server:
  port: 8083
